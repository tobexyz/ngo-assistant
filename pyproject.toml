[build-system]
# setuptools 84.0.0: newest release on or before the 2026-10-07 cut-off (pypi.org, checked 2026-10-14).
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ngo-assistant"
version = "0.0.1"
description = "White-label RAG assistant for NGOs: agentic vs. vector retrieval, measured."
requires-python = ">=3.11"
dependencies = [
    "ollama==0.6.3",
    "pydantic==2.13.5",
    "PyYAML==6.0.3",
    "psycopg[binary]==3.3.6",
    "pgvector==0.5.0",
]

[project.scripts]
ngo-assistant = "ngo_assistant.cli:main"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
    "mypy==2.4.0",
    "types-PyYAML==6.0.12.20260906",
]

corpus = [
    "pypdf==6.20.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: needs the docker compose stack (ollama + postgres) running; run with -m integration",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4"]
# UP042: Category(str, Enum) is kept on purpose (decisions.md); StrEnum would change str() behaviour.
ignore = ["UP042"]

[tool.ruff.lint.isort]
known-first-party = ["ngo_assistant"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
mypy_path = "src"
warn_unused_configs = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
